name: Cache mode boundary check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorized-save:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - name: Create synthetic marker
        run: echo owned-test-marker > marker.txt
      - name: Save allowed marker
        uses: actions/cache/save@v4
        with:
          path: marker.txt
          key: bounty-allowed-${{ github.run_id }}

  denied-save:
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      - name: Create synthetic marker
        run: echo owned-test-marker > marker.txt
      - name: Try client mode override
        uses: actions/cache/save@v4
        env:
          ACTIONS_CACHE_MODE: write
        with:
          path: marker.txt
          key: bounty-denied-${{ github.run_id }}
